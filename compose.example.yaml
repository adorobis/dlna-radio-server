# The server must be reachable on the LAN under its own address, so speakers
# can find it (SSDP multicast). Use either host networking...
services:
  dlna-radio:
    image: ghcr.io/adorobis/dlna-radio-server:latest
    container_name: dlna-radio
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config:/config
    # environment:
    #   - DLNA_RADIO_BITRATE=256k

